name: letsens-aiot

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: letsens-backend
    restart: unless-stopped
    volumes:
      - ./backend/storage:/var/www/backend/storage
      - ./backend/database:/var/www/backend/database
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=base64:v1ZkPzJ5q9x0L8sR7tM4N1wY6eU3iO9pL2aK5bV8cX0=
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/backend/database/database.sqlite
    networks:
      - letsens-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: letsens-frontend
    restart: unless-stopped
    networks:
      - letsens-network

  nginx:
    image: nginx:alpine
    container_name: letsens-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend/storage/app/public:/var/www/backend/storage/app/public
    depends_on:
      - backend
      - frontend
    networks:
      - letsens-network

  emulator:
    build:
      context: ./backend
      dockerfile: emulator.Dockerfile
    container_name: letsens-emulator
    restart: unless-stopped
    networks:
      - letsens-network

networks:
  letsens-network:
    driver: bridge
