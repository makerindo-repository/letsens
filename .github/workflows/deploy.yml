name: LetSens AIoT CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # 1. CONTINUOUS INTEGRATION (Lint, Test, & Build)
  # -------------------------------------------------------------
  frontend-ci:
    name: 🎨 Frontend CI (TypeScript & Vite Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: TypeScript Type Check
        run: cd frontend && npx tsc --noEmit

      - name: Build Frontend Production Assets
        run: cd frontend && npm run build

  backend-ci:
    name: ⚡ Backend CI (PHP Syntax & Test Suite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite3, bcmath
          tools: composer:v2

      - name: Install Backend Dependencies
        run: cd backend && composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment File & Key
        run: |
          cd backend
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit Test Suite
        run: |
          cd backend
          ./vendor/bin/phpunit

  # -------------------------------------------------------------
  # 2. CONTINUOUS DEPLOYMENT (Automated VPS Deployment)
  # -------------------------------------------------------------
  deploy:
    name: 🚀 Continuous Deployment to VPS Production
    needs: [frontend-ci, backend-ci]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          script: |
            cd /home/maker/letsens
            echo "📥 Pulling latest commits from main branch..."
            git pull origin main
            echo "🐳 Building and updating Docker Compose containers..."
            docker compose up -d --build --remove-orphans
            echo "🔄 Reloading Nginx proxy to update internal container IPs..."
            docker compose exec -T nginx nginx -s reload || docker compose restart nginx
            echo "🧹 Cleaning unused Docker build cache..."
            docker image prune -f
            echo "✅ LetSens Production VPS Deployment Complete!"
